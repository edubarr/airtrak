services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_DATABASE_URL=postgres://airtrak:airtrak@postgres:5432/airtrak?sslmode=disable
    depends_on:
      - postgres

  postgres:
    image: postgres:18-alpine
    container_name: airtrak-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=airtrak
      - POSTGRES_PASSWORD=airtrak
      - POSTGRES_DB=airtrak
    volumes:
      - postgres_app_data:/var/lib/postgresql

volumes:
  postgres_app_data:
