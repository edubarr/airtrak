info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/airtrak.auth.v1.AuthService/Register"
  body:
    type: json
    data: |-
      {
        "email": "player@example.com",
        "password": "12345678",
        "displayName": "playerExample",
        "locale": "pt-BR"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.accessToken
        method: jsonq
      variable:
        name: accessToken
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
